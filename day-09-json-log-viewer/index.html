<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Log Viewer</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22d3ee;
    --danger: #f87171;
    --warn: #fbbf24;
    --info: #60a5fa;
    --debug: #94a3b8;
    --radius: 12px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 1.7rem; }
  header p { margin: 0 0 20px; color: var(--muted); }
  .panel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  button {
    background: #0b1220;
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #062028; font-weight: 700; }
  button.primary:hover { filter: brightness(1.1); color: #062028; }
  button:disabled { opacity: 0.45; cursor: default; }
  button:disabled:hover { border-color: var(--card-border); color: var(--text); }
  textarea {
    width: 100%;
    min-height: 200px;
    resize: vertical;
    background: #0b1220;
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 0.85rem;
    line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0 4px; }
  .filters .lbl { color: var(--muted); font-size: 0.85rem; }
  #level-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  #level-chips button { padding: 5px 12px; font-size: 0.8rem; border-radius: 999px; }
  #level-chips button.off { opacity: 0.35; }
  #search {
    flex: 1;
    min-width: 180px;
    background: #0b1220;
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.9rem;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  #stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  #stats[hidden] { display: none; }
  .stat {
    background: #0b1220;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .stat b { color: var(--text); font-size: 1rem; margin-right: 4px; }
  .stat.alert { border-color: var(--danger); }
  .stat.alert b { color: var(--danger); }
  #output { font-family: var(--mono); font-size: 0.85rem; }
  #output[hidden] { display: none; }
  .empty { color: var(--muted); font-family: system-ui, sans-serif; padding: 12px 4px; }
  /* --- log entry rows --- */
  .entry { border: 1px solid var(--card-border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .entry-row {
    width: 100%;
    display: flex;
    gap: 10px;
    align-items: baseline;
    text-align: left;
    background: #0b1220;
    border: none;
    border-radius: 0;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 0.85rem;
  }
  .entry-row:hover { border: none; color: var(--text); background: #131c31; }
  .line-no { color: var(--muted); min-width: 3ch; text-align: right; flex-shrink: 0; }
  .lv {
    flex-shrink: 0;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    border-radius: 4px;
    padding: 2px 8px;
    min-width: 64px;
    text-align: center;
  }
  .lv-error   { background: rgba(248,113,113,.15); color: var(--danger); border: 1px solid var(--danger); }
  .lv-warn    { background: rgba(251,191,36,.12); color: var(--warn);   border: 1px solid var(--warn); }
  .lv-info    { background: rgba(96,165,250,.12);  color: var(--info);   border: 1px solid var(--info); }
  .lv-debug   { background: rgba(148,163,184,.12); color: var(--debug); border: 1px solid var(--debug); }
  .lv-unknown { background: rgba(148,163,184,.06); color: var(--muted); border: 1px dashed var(--muted); }
  .entry-time { color: var(--muted); flex-shrink: 0; }
  .no-time { color: #475569; }
  .entry-msg { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chev { color: var(--muted); flex-shrink: 0; }
  .parse-error-label { color: var(--danger); font-weight: 700; }
  .entry-detail { border-top: 1px solid var(--card-border); padding: 12px; background: #0d1526; }
  .raw-line { margin: 0; white-space: pre-wrap; word-break: break-word; color: var(--danger); }
  /* --- JSON tree --- */
  .tree-view { border: 1px solid var(--card-border); border-radius: 8px; padding: 14px; background: #0d1526; }
  .j-key { color: var(--accent); }
  .j-str { color: #86efac; overflow-wrap: anywhere; }
  .j-num { color: var(--warn); }
  .j-bool { color: #c084fc; }
  .j-null { color: var(--danger); font-style: italic; }
  .j-punct { color: var(--muted); }
  .j-count { color: #64748b; font-size: 0.78rem; margin: 0 4px; }
  details.j-node > summary { cursor: pointer; list-style: none; }
  details.j-node > summary::-webkit-details-marker { display: none; }
  details.j-node > summary::before { content: "▾ "; color: var(--muted); }
  details.j-node:not([open]) > summary::before { content: "▸ "; }
  .j-children { margin-left: 18px; border-left: 1px solid #263349; padding-left: 10px; }
  .j-item { padding: 1px 0; }
  .foot { color: var(--muted); font-size: 0.82rem; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>JSON Log Viewer</h1>
    <p>Paste minified JSON — a single object, an array, or one object per line (NDJSON) —
       and get a readable, filterable log view. Built for app-support and QA work.</p>
  </header>

  <div class="panel">
    <div class="toolbar">
      <button id="btn-format" class="primary">Format</button>
      <button id="btn-sample-logs">Load sample logs</button>
      <button id="btn-sample-json">Load sample JSON</button>
      <button id="btn-clear">Clear</button>
      <button id="btn-copy">Copy output</button>
      <button id="btn-download">Download .json</button>
    </div>
    <textarea id="input" spellcheck="false" placeholder='Paste JSON here… e.g.&#10;{"level":"info","msg":"server started","port":3000}&#10;{"level":"error","msg":"db timeout","retry":true}'></textarea>
    <div class="filters" id="filters" hidden>
      <span class="lbl">Levels:</span>
      <div id="level-chips">
        <button data-level="ERROR">ERROR</button>
        <button data-level="WARN">WARN</button>
        <button data-level="INFO">INFO</button>
        <button data-level="DEBUG">DEBUG</button>
        <button data-level="UNKNOWN">UNKNOWN</button>
      </div>
      <input id="search" type="text" placeholder="Search log text… (filters as you type)">
    </div>
  </div>

  <div id="stats" hidden></div>
  <div id="output" class="panel" hidden></div>

  <p class="foot">Runs 100% in your browser — pasted logs never leave your machine.</p>
</div>

<script>
/* =====================================================================
 * JSON Log Viewer — pure logic (no DOM). These functions are unit-tested
 * in test.js by extracting this <script> block and running it in Node.
 * ===================================================================== */
'use strict';

/** Escape the 4 characters that can break out of HTML text/attributes. */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/**
 * Decide what the pasted text is:
 *   'empty'   — nothing to do
 *   'json'    — one JSON value (object, array, or pretty-printed)
 *   'ndjson'  — multiple lines, at least half of them valid JSON objects
 *   'invalid' — anything else
 */
function classifyInput(text) {
  const t = String(text).trim();
  if (t.length === 0) return 'empty';
  try { JSON.parse(t); return 'json'; } catch (e) { /* not a single value */ }
  const lines = t.split(/\r?\n/).filter(l => l.trim().length > 0);
  if (lines.length < 2) return 'invalid';
  let ok = 0;
  for (const l of lines) {
    try { JSON.parse(l); ok++; } catch (e) { /* bad line */ }
  }
  return ok / lines.length >= 0.5 ? 'ndjson' : 'invalid';
}

/* --- log-level detection ------------------------------------------------
 * Real logs are inconsistent: "level", "severity", strings like "warn",
 * pino/Bunyan numbers (10/20/30/40/50/60) and syslog numbers (0-7).
 * detectLevel() normalises all of them to ERROR / WARN / INFO / DEBUG.
 */
const STRING_LEVELS = {
  error: 'ERROR', err: 'ERROR', fatal: 'ERROR', crit: 'ERROR',
  critical: 'ERROR', severe: 'ERROR',
  warn: 'WARN', warning: 'WARN',
  info: 'INFO', notice: 'INFO', information: 'INFO',
  debug: 'DEBUG', trace: 'DEBUG', verbose: 'DEBUG'
};
const PINO_LEVELS   = { 10: 'DEBUG', 20: 'DEBUG', 30: 'INFO', 40: 'WARN', 50: 'ERROR', 60: 'ERROR' };
const SYSLOG_LEVELS = { 0: 'ERROR', 1: 'ERROR', 2: 'ERROR', 3: 'ERROR', 4: 'WARN', 5: 'INFO', 6: 'INFO', 7: 'DEBUG' };

function detectLevel(value) {
  if (typeof value === 'number' && Number.isFinite(value)) {
    if (PINO_LEVELS[value] !== undefined) return PINO_LEVELS[value];
    if (SYSLOG_LEVELS[value] !== undefined) return SYSLOG_LEVELS[value];
    // Heuristic for unknown numeric schemes: higher = worse.
    if (value >= 50) return 'ERROR';
    if (value >= 40) return 'WARN';
    if (value >= 30) return 'INFO';
    return 'DEBUG';
  }
  if (typeof value === 'string') {
    const v = value.trim().toLowerCase();
    if (STRING_LEVELS[v] !== undefined) return STRING_LEVELS[v];
  }
  return 'UNKNOWN';
}

const LEVEL_FIELDS = ['level', 'severity', 'loglevel', 'log_level', 'priority'];

/** Find the log level of a parsed JSON value by checking common field names. */
function levelOf(obj) {
  if (obj === null || typeof obj !== 'object') return 'UNKNOWN';
  for (const f of LEVEL_FIELDS) {
    if (obj[f] !== undefined && obj[f] !== null) {
      const l = detectLevel(obj[f]);
      if (l !== 'UNKNOWN') return l;
    }
  }
  return 'UNKNOWN';
}

const TIME_FIELDS = ['timestamp', 'time', 'ts', '@timestamp', 'date', 'datetime', 'created_at', 'logged_at'];

/**
 * Convert a numeric epoch to milliseconds. Real-world epochs come in three
 * flavours: seconds (10 digits), milliseconds (13), microseconds (16).
 */
function normalizeEpoch(n) {
  if (n >= 1e15) return Math.floor(n / 1000); // microseconds -> ms
  if (n >= 1e12) return n;                    // already milliseconds
  if (n >= 1e9)  return n * 1000;             // seconds -> ms
  return null;                                // too small to be a real epoch
}

/** Pull a timestamp out of a log object; returns an ISO string or null. */
function extractTimestamp(obj) {
  if (obj === null || typeof obj !== 'object') return null;
  for (const f of TIME_FIELDS) {
    const v = obj[f];
    if (v === undefined || v === null || v === '') continue;
    if (typeof v === 'number' && Number.isFinite(v)) {
      const ms = normalizeEpoch(Math.floor(Math.abs(v)));
      if (ms !== null) return new Date(ms).toISOString();
    } else if (typeof v === 'string') {
      const d = new Date(v);
      if (!isNaN(d.getTime())) return d.toISOString();
    }
  }
  return null;
}

const MESSAGE_FIELDS = ['message', 'msg', 'log', 'text', 'description', 'error', 'err'];

/** Pull the human-readable message out of a log object. */
function extractMessage(obj, fallback) {
  if (obj === null || typeof obj !== 'object') return fallback || '';
  for (const f of MESSAGE_FIELDS) {
    const v = obj[f];
    if (v === undefined || v === null) continue;
    if (typeof v === 'string') {
      if (v.trim().length > 0) return v;
      continue;
    }
    return JSON.stringify(v); // numbers / objects / arrays become text
  }
  return fallback || '';
}

/** Build one normalised log entry from a parsed JSON value. */
function makeEntry(lineNo, data, raw) {
  return {
    lineNo: lineNo,
    raw: raw,
    data: data,
    parseError: false,
    level: levelOf(data),
    timestamp: extractTimestamp(data),
    message: extractMessage(data, raw.length > 140 ? raw.slice(0, 140) + '…' : raw)
  };
}

/**
 * Parse pasted text into { mode, entries, parseErrors }.
 * Entries always carry: lineNo, raw, data, parseError, level, timestamp, message.
 */
function parseLogInput(text) {
  const mode = classifyInput(text);
  const entries = [];
  if (mode === 'json') {
    const data = JSON.parse(String(text).trim());
    if (Array.isArray(data)) {
      data.forEach((d, i) => entries.push(makeEntry(i + 1, d, JSON.stringify(d))));
    } else {
      entries.push(makeEntry(1, data, JSON.stringify(data)));
    }
  } else if (mode === 'ndjson') {
    String(text).trim().split(/\r?\n/).forEach((line, i) => {
      const t = line.trim();
      if (t.length === 0) return;
      try {
        entries.push(makeEntry(i + 1, JSON.parse(t), t));
      } catch (e) {
        entries.push({
          lineNo: i + 1, raw: t, data: null, parseError: true,
          level: 'UNKNOWN', timestamp: null, message: t.slice(0, 140)
        });
      }
    });
  }
  return { mode: mode, entries: entries, parseErrors: entries.filter(e => e.parseError).length };
}

/** Keep entries whose level is active and whose raw text matches the query. */
function filterEntries(entries, activeLevels, query) {
  const q = String(query || '').trim().toLowerCase();
  const set = new Set(activeLevels);
  return entries.filter(e => {
    if (!set.has(e.level)) return false;
    if (q.length > 0 && String(e.raw).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

/** Count entries per level (used for the stats bar). */
function countByLevel(entries) {
  const counts = { ERROR: 0, WARN: 0, INFO: 0, DEBUG: 0, UNKNOWN: 0 };
  for (const e of entries) {
    if (counts[e.level] !== undefined) counts[e.level]++;
    else counts.UNKNOWN++;
  }
  return counts;
}

/** Format an ISO timestamp for display in the row. */
function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });
}

/* --- HTML rendering (returns strings; no DOM needed) -------------------- */

/**
 * Recursively render any JSON value as a collapsible, syntax-highlighted
 * tree. Objects/arrays use <details> so the browser handles expand/collapse.
 */
function renderJsonHtml(value, depth) {
  depth = depth || 0;
  if (value === null) return '<span class="j-null">null</span>';
  const t = typeof value;
  if (t === 'string') return '<span class="j-str">&quot;' + escapeHtml(value) + '&quot;</span>';
  if (t === 'number') return '<span class="j-num">' + String(value) + '</span>';
  if (t === 'boolean') return '<span class="j-bool">' + String(value) + '</span>';
  if (Array.isArray(value)) {
    if (value.length === 0) return '<span class="j-punct">[]</span>';
    const items = value.map(v =>
      '<div class="j-item">' + renderJsonHtml(v, depth + 1) + '</div>').join('');
    return '<details class="j-node" open>' +
      '<summary><span class="j-punct">[</span>' +
      '<span class="j-count">' + value.length + ' item' + (value.length === 1 ? '' : 's') + '</span>' +
      '<span class="j-punct">]</span></summary>' +
      '<div class="j-children">' + items + '</div></details>';
  }
  if (t === 'object') {
    const keys = Object.keys(value);
    if (keys.length === 0) return '<span class="j-punct">{}</span>';
    const items = keys.map(k =>
      '<div class="j-item"><span class="j-key">&quot;' + escapeHtml(k) + '&quot;</span>' +
      '<span class="j-punct">: </span>' + renderJsonHtml(value[k], depth + 1) + '</div>').join('');
    return '<details class="j-node" open>' +
      '<summary><span class="j-punct">{</span>' +
      '<span class="j-count">' + keys.length + ' key' + (keys.length === 1 ? '' : 's') + '</span>' +
      '<span class="j-punct">}</span></summary>' +
      '<div class="j-children">' + items + '</div></details>';
  }
  return '<span class="j-null">' + escapeHtml(t) + '</span>';
}

const LEVEL_CLASS = {
  ERROR: 'lv-error', WARN: 'lv-warn', INFO: 'lv-info', DEBUG: 'lv-debug', UNKNOWN: 'lv-unknown'
};

/** Render one log entry as a clickable row + hidden pretty-printed detail. */
function renderEntryHtml(e) {
  const body = e.parseError
    ? '<pre class="raw-line">' + escapeHtml(e.raw) + '</pre>'
    : renderJsonHtml(e.data);
  const time = e.timestamp
    ? escapeHtml(formatTime(e.timestamp))
    : '<span class="no-time">—</span>';
  const msg = e.parseError
    ? '<span class="parse-error-label">not valid JSON:</span> ' + escapeHtml(e.message)
    : escapeHtml(e.message || '(no message field)');
  return '<div class="entry">' +
    '<button class="entry-row" aria-expanded="false">' +
      '<span class="line-no">' + e.lineNo + '</span>' +
      '<span class="lv ' + LEVEL_CLASS[e.level] + '">' + e.level + '</span>' +
      '<span class="entry-time">' + time + '</span>' +
      '<span class="entry-msg">' + msg + '</span>' +
      '<span class="chev">▸</span>' +
    '</button>' +
    '<div class="entry-detail" hidden>' + body + '</div>' +
  '</div>';
}

function renderEntriesHtml(entries) {
  if (entries.length === 0) {
    return '<p class="empty">No entries match the current filters.</p>';
  }
  return entries.map(renderEntryHtml).join('');
}

/** Produce the text used by "Copy output" / "Download": pretty JSON, one entry per block. */
function formatForExport(result) {
  if (!result || (result.mode !== 'json' && result.mode !== 'ndjson')) return '';
  return result.entries.map(e => {
    if (e.parseError) return e.raw;
    try { return JSON.stringify(e.data, null, 2); }
    catch (err) { return e.raw; }
  }).join('\n');
}

/* =====================================================================
 * DOM wiring below. Guarded so the pure logic above can run in Node.
 * ===================================================================== */
if (typeof document !== 'undefined') {
  (function init() {
    const input   = document.getElementById('input');
    const output  = document.getElementById('output');
    const stats   = document.getElementById('stats');
    const search  = document.getElementById('search');
    const filters = document.getElementById('filters');
    const chips   = Array.from(document.querySelectorAll('#level-chips button'));
    const ALL_LEVELS = ['ERROR', 'WARN', 'INFO', 'DEBUG', 'UNKNOWN'];
    const activeLevels = new Set(ALL_LEVELS);
    let lastResult = null;

    // Realistic app-support sample: mixed levels, field names, timestamp
    // formats, a pino-style numeric level, and one corrupt line.
    const SAMPLE_LOGS = [
      '{"timestamp":"2026-10-02T08:15:03.421Z","level":"info","service":"auth-api","msg":"login attempt","user":"s.rahman","ip":"142.117.23.8"}',
      '{"timestamp":"2026-10-02T08:15:04.109Z","level":"warn","service":"auth-api","msg":"slow database query","duration_ms":1842,"query":"SELECT * FROM sessions WHERE user_id = ?"}',
      '{"timestamp":"2026-10-02T08:15:05.884Z","level":"error","service":"payments","msg":"charge failed","order_id":88412,"error":{"code":"card_declined","retryable":false}}',
      '{"ts":1759371306,"level":40,"service":"cache","msg":"cache miss","key":"user:90412"}',
      '{"time":"2026-10-02T08:15:07Z","severity":"INFO","service":"auth-api","msg":"login succeeded","user":"s.rahman"}',
      'this line is not json and will be flagged',
      '{"timestamp":"2026-10-02T08:15:09.002Z","level":"debug","service":"worker","msg":"job finished","job":"invoice-batch-7","took_ms":312}'
    ].join('\n');

    const SAMPLE_JSON = '{\n' +
      '  "app": "billing-service",\n' +
      '  "version": "2.4.1",\n' +
      '  "uptime_seconds": 86412,\n' +
      '  "healthy": true,\n' +
      '  "database": {\n' +
      '    "host": "db-01.internal",\n' +
      '    "port": 5432,\n' +
      '    "pool": { "size": 20, "idle": 4 },\n' +
      '    "ssl": true\n' +
      '  },\n' +
      '  "features": ["invoices", "refunds", "webhooks"],\n' +
      '  "last_error": null\n' +
      '}';

    function statChip(label, value, alert) {
      return '<span class="stat' + (alert ? ' alert' : '') + '"><b>' +
        value + '</b>' + escapeHtml(label) + '</span>';
    }

    // Single JSON object -> tree view. Arrays / NDJSON -> filterable entry list.
    function isTreeView() {
      return lastResult && lastResult.mode === 'json' && lastResult.entries.length === 1;
    }

    function render() {
      if (!lastResult || (lastResult.mode !== 'json' && lastResult.mode !== 'ndjson')) return;
      const counts = countByLevel(lastResult.entries);
      const filtered = filterEntries(lastResult.entries, activeLevels, search.value);
      stats.innerHTML =
        statChip('entries', lastResult.entries.length, false) +
        statChip('errors', counts.ERROR, counts.ERROR > 0) +
        statChip('warnings', counts.WARN, false) +
        statChip('bad lines', lastResult.parseErrors, lastResult.parseErrors > 0) +
        statChip('showing', filtered.length, false);
      stats.hidden = false;
      if (isTreeView()) {
        filters.hidden = true;
        output.innerHTML = '<div class="tree-view">' + renderJsonHtml(lastResult.entries[0].data) + '</div>';
      } else {
        filters.hidden = false;
        output.innerHTML = renderEntriesHtml(filtered);
      }
      output.hidden = false;
    }

    function doFormat() {
      const result = parseLogInput(input.value);
      lastResult = result;
      if (result.mode === 'empty') {
        stats.hidden = true; filters.hidden = true;
        output.innerHTML = '<p class="empty">Paste some JSON above, then press Format — or try a sample.</p>';
        output.hidden = false;
        return;
      }
      if (result.mode === 'invalid') {
        stats.hidden = true; filters.hidden = true;
        output.innerHTML = '<p class="empty">Couldn\'t parse that as JSON. ' +
          'For log mode, put one JSON object per line.</p>';
        output.hidden = false;
        return;
      }
      render();
    }

    // Expand / collapse an entry's detail (event delegation: one listener).
    output.addEventListener('click', function (ev) {
      const btn = ev.target.closest('.entry-row');
      if (!btn) return;
      const detail = btn.parentElement.querySelector('.entry-detail');
      const willOpen = detail.hidden;
      detail.hidden = !willOpen;
      btn.setAttribute('aria-expanded', String(willOpen));
      btn.querySelector('.chev').textContent = willOpen ? '▾' : '▸';
    });

    document.getElementById('btn-format').addEventListener('click', doFormat);

    document.getElementById('btn-sample-logs').addEventListener('click', function () {
      input.value = SAMPLE_LOGS;
      doFormat();
    });

    document.getElementById('btn-sample-json').addEventListener('click', function () {
      input.value = SAMPLE_JSON;
      doFormat();
    });

    document.getElementById('btn-clear').addEventListener('click', function () {
      input.value = '';
      lastResult = null;
      search.value = '';
      output.hidden = true;
      stats.hidden = true;
      filters.hidden = true;
      input.focus();
    });

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).then(() => true, () => false);
      }
      // Fallback for older browsers / non-secure contexts.
      return new Promise(function (resolve) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        resolve(ok);
      });
    }

    function flashButton(id, label) {
      const btn = document.getElementById(id);
      const original = btn.textContent;
      btn.textContent = label;
      setTimeout(function () { btn.textContent = original; }, 1400);
    }

    document.getElementById('btn-copy').addEventListener('click', function () {
      if (!lastResult) { flashButton('btn-copy', 'Nothing to copy'); return; }
      copyText(formatForExport(lastResult)).then(function (ok) {
        flashButton('btn-copy', ok ? 'Copied!' : 'Copy failed');
      });
    });

    document.getElementById('btn-download').addEventListener('click', function () {
      if (!lastResult) { flashButton('btn-download', 'Nothing to save'); return; }
      const blob = new Blob([formatForExport(lastResult)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'formatted-log.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 100);
      flashButton('btn-download', 'Saved!');
    });

    chips.forEach(function (chip) {
      chip.addEventListener('click', function () {
        const level = chip.getAttribute('data-level');
        if (activeLevels.has(level)) {
          activeLevels.delete(level);
          chip.classList.add('off');
        } else {
          activeLevels.add(level);
          chip.classList.remove('off');
        }
        render();
      });
    });

    search.addEventListener('input', render);
  })();
}
</script>
</body>
</html>
